<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0c">
  <meta name="description" content="Pulso: tu nutricionista y entrenador personal. Menús con productos de Mercadona, registro de comidas y entreno HYROX y de fuerza.">
  <title>Pulso</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pulso">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
  <style>
    /* Pantalla de carga: se ve hasta que arranca la app */
    html { background: #0a0a0c; }
    #carga { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: #0a0a0c; transition: opacity 0.35s, visibility 0.35s; }
    #carga.fuera { opacity: 0; visibility: hidden; }
    #carga div { display: grid; justify-items: center; gap: 18px; }
    #carga svg { width: 96px; height: 96px; }
    #carga .linea { stroke-dasharray: 100; stroke-dashoffset: 100; animation: trazar 1.2s cubic-bezier(.6,.1,.3,1) infinite; }
    #carga .punto { animation: latir 1.2s ease-in-out infinite; transform-origin: 428px 290px; }
    #carga b { font: 800 26px/1 "Manrope", system-ui, sans-serif; letter-spacing: -0.03em; color: #f5f5f7; }
    @keyframes trazar { 0% { stroke-dashoffset: 100; } 60%, 100% { stroke-dashoffset: 0; } }
    @keyframes latir { 0%, 55% { transform: scale(0); } 70% { transform: scale(1.25); } 100% { transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) { #carga .linea, #carga .punto { animation: none; stroke-dashoffset: 0; } }
  </style>
</head>
<body>
  <div id="carga" aria-hidden="true">
    <div>
      <svg viewBox="0 0 512 512">
        <defs><linearGradient id="cn" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffb21f"/><stop offset=".55" stop-color="#ff5b1f"/><stop offset="1" stop-color="#ff2e4d"/></linearGradient></defs>
        <path class="linea" d="M84 290h78l34-58 52 150 58-262 42 170h80" fill="none" stroke="url(#cn)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" pathLength="100"/>
        <circle class="punto" cx="428" cy="290" r="26" fill="#fff"/>
      </svg>
      <b>Pulso</b>
    </div>
  </div>
  <div id="app"></div>
  <noscript>Esta aplicación necesita JavaScript.</noscript>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
