<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0c">
  <meta name="description" content="Tu nutricionista y entrenador personal: menús con productos de Mercadona, registro de comidas y preparación de HYROX.">
  <title>Mi Nutricionista</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nutricionista">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
  <style>
    /* Pantalla de carga: se ve hasta que arranca la app */
    html { background: #0a0a0c; }
    #carga { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: #0a0a0c; transition: opacity 0.35s, visibility 0.35s; }
    #carga.fuera { opacity: 0; visibility: hidden; }
    #carga div { display: grid; justify-items: center; gap: 18px; }
    #carga svg { width: 96px; height: 96px; }
    #carga .arco { animation: girar 1.1s cubic-bezier(.5,.1,.3,1) infinite; transform-origin: 256px 256px; }
    #carga b { font: 800 22px/1 "Manrope", system-ui, sans-serif; letter-spacing: -0.02em; color: #f5f5f7; }
    #carga b span { color: #ff5b1f; }
    @keyframes girar { to { transform: rotate(270deg); } }
    @media (prefers-reduced-motion: reduce) { #carga .arco { animation: none; } }
  </style>
</head>
<body>
  <div id="carga" aria-hidden="true">
    <div>
      <svg viewBox="0 0 512 512">
        <defs><linearGradient id="cn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9a1f"/><stop offset="1" stop-color="#ff3d2e"/></linearGradient></defs>
        <circle cx="256" cy="256" r="146" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="42"/>
        <circle class="arco" cx="256" cy="256" r="146" fill="none" stroke="url(#cn)" stroke-width="42" stroke-linecap="round" stroke-dasharray="690 917" transform="rotate(-90 256 256)"/>
        <path d="M278 152 198 270h52l-18 90 84-124h-54z" fill="#fff" stroke="#fff" stroke-width="12" stroke-linejoin="round"/>
      </svg>
      <b>Mi <span>Nutricionista</span></b>
    </div>
  </div>
  <div id="app"></div>
  <noscript>Esta aplicación necesita JavaScript.</noscript>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
