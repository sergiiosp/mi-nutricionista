# Publica la app en GitHub Pages en cada cambio y actualiza los precios
# de Mercadona todos los lunes (también se puede lanzar a mano desde la pestaña Actions).
name: Publicar

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 5 * * 1' # lunes a las 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm ci

      - name: Actualizar precios de Mercadona
        if: github.event_name != 'push'
        run: |
          node scripts/actualizar-precios.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/precios.js
          git commit -m "Actualizar precios de Mercadona" || echo "Sin cambios"
          git push

      - name: Comprobar el motor de menús
        run: node scripts/probar-motor.mjs || echo "::warning::Algún perfil de prueba se sale de margen"

      - name: Compilar la app
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: despliegue
        uses: actions/deploy-pages@v4
